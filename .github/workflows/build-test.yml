name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    
    - name: Restore dependencies
      run: dotnet restore CIDemoCalculator/CIDemoCalculator.sln
    
    - name: Build
      run: dotnet build CIDemoCalculator/CIDemoCalculator.sln --no-restore
    
    - name: Test
      run: dotnet test CIDemoCalculator/CIDemoCalculator.sln --no-build --verbosity normal
